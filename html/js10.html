<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Canvas Example</title>
</head>

<body onLoad="draw()">
    <canvas id="canvas" width="400" height="400"></canvas>
    <script>
        function draw() {
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d'); // Tạo thiết bị ngữ cảnh

            // Xóa canvas trước khi vẽ lại
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ hình chữ nhật
            ctx.fillStyle = "rgb(0,255,255)"; // Màu tô
            ctx.fillRect(0, 0, 400, 400); // Gọi hàm tô màu

            // Vẽ hình tròn với gradient
            ctx.beginPath();
            ctx.arc(200, 200, 200, 0, 2 * Math.PI);
            var grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grd.addColorStop(0, "red");
            grd.addColorStop(0.5, "white");
            grd.addColorStop(1, "red");
            ctx.fillStyle = grd;
            ctx.fill();
            ctx.stroke(); // Vẽ viền (nếu cần)

            // Vẽ hình tứ giác (polygon)
            ctx.beginPath();
            ctx.moveTo(200, 0);
            ctx.lineTo(400, 200);
            ctx.lineTo(200, 400);
            ctx.lineTo(0, 200);
            ctx.lineTo(200, 0);
            ctx.fillStyle = 'yellow'; // Màu tô
            ctx.fill();
            ctx.strokeStyle = 'cyan'; // Màu viền
            ctx.lineWidth = 3; // Độ dày của stroke
            ctx.stroke();

            // Vẽ văn bản với stroke
            ctx.font = "80px Arial";
            ctx.lineWidth = 5; // Độ dày của stroke
            ctx.strokeStyle = "blue"; // Màu stroke
            ctx.strokeText("HTML5", canvas.width / 5, canvas.height / 2 + 20);
        }
    </script>
</body>

</html>
